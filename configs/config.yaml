random_seed: 42
data:
  raw_dir: data/raw
  processed_dir: data/processed
  sample_frac: 0.05
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
preprocessing:
  drop_columns:
  - Flow ID
  - Source IP
  - Src IP
  - Source Port
  - Src Port
  - Destination IP
  - Dst IP
  - Destination Port
  - Dst Port
  - Protocol
  - Timestamp
  inf_handling: drop
  nan_handling: drop
cnn:
  conv1_filters: 32
  conv2_filters: 64
  kernel_size: 3
  dropout_rate: 0.3
  embedding_dim: 64
  batch_size: 256
  epochs: 20
  learning_rate: 0.001
  patience: 5
xgboost:
  n_estimators: 200
  max_depth: 6
  learning_rate: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
  eval_metric: mlogloss
  early_stopping_rounds: 10
  tree_method: hist
feature_order:
- Flow Duration
- Total Fwd Packets
- Total Backward Packets
- Total Length of Fwd Packets
- Total Length of Bwd Packets
- Fwd Packet Length Max
- Fwd Packet Length Min
- Fwd Packet Length Mean
- Fwd Packet Length Std
- Bwd Packet Length Max
- Bwd Packet Length Min
- Bwd Packet Length Mean
- Bwd Packet Length Std
- Flow Bytes/s
- Flow Packets/s
- Flow IAT Mean
- Flow IAT Std
- Flow IAT Max
- Flow IAT Min
- Fwd IAT Total
- Fwd IAT Mean
- Fwd IAT Std
- Fwd IAT Max
- Fwd IAT Min
- Bwd IAT Total
- Bwd IAT Mean
- Bwd IAT Std
- Bwd IAT Max
- Bwd IAT Min
- Fwd PSH Flags
- Bwd PSH Flags
- Fwd URG Flags
- Bwd URG Flags
- Fwd Header Length
- Bwd Header Length
- Fwd Packets/s
- Bwd Packets/s
- Min Packet Length
- Max Packet Length
- Packet Length Mean
- Packet Length Std
- Packet Length Variance
- FIN Flag Count
- SYN Flag Count
- RST Flag Count
- PSH Flag Count
- ACK Flag Count
- URG Flag Count
- CWE Flag Count
- ECE Flag Count
- Down/Up Ratio
- Average Packet Size
- Avg Fwd Segment Size
- Avg Bwd Segment Size
- Fwd Header Length.1
- Fwd Avg Bytes/Bulk
- Fwd Avg Packets/Bulk
- Fwd Avg Bulk Rate
- Bwd Avg Bytes/Bulk
- Bwd Avg Packets/Bulk
- Bwd Avg Bulk Rate
- Subflow Fwd Packets
- Subflow Fwd Bytes
- Subflow Bwd Packets
- Subflow Bwd Bytes
- Init_Win_bytes_forward
- Init_Win_bytes_backward
- act_data_pkt_fwd
- min_seg_size_forward
- Active Mean
- Active Std
- Active Max
- Active Min
- Idle Mean
- Idle Std
- Idle Max
- Idle Min
class_mapping:
  0: BENIGN
  1: Bot
  2: DDoS
  3: DoS GoldenEye
  4: DoS Hulk
  5: DoS Slowhttptest
  6: DoS slowloris
  7: FTP-Patator
  8: Heartbleed
  9: PortScan
  10: SSH-Patator
  11: Web Attack  Brute Force
  12: Web Attack  XSS
n_features: 77
n_classes: 13
